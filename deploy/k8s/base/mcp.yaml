# MCP server over streamable HTTP at http://mcp:8000/mcp. Uses PostGIS (read-only role) via DATABASE_URL.
# Remove DATABASE_URL to use the DuckDB backend on the published GeoParquet instead (needs egress to github.com).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
spec:
  replicas: 1
  selector: {matchLabels: {app: mcp}}
  template:
    metadata: {labels: {app: mcp}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      automountServiceAccountToken: false
      containers:
        - name: mcp
          image: ghcr.io/knightchrism/sjrwmd-mcp:latest   # build from mcp/Dockerfile
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: SJRWMD_MCP_TRANSPORT, value: streamable-http}
            - {name: SJRWMD_MCP_HOST, value: 0.0.0.0}
            - {name: SJRWMD_MCP_PORT, value: "8000"}
            # Host-header (DNS-rebinding) allow-list; localhost is always allowed. The cloud overlay adds the public host.
            - {name: SJRWMD_MCP_ALLOWED_HOSTS, value: "mcp:*,mcp.sjrwmd:*,mcp.sjrwmd.svc:*,mcp.sjrwmd.svc.cluster.local:*"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: sjrwmd-db, key: READER_URL}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  selector: {app: mcp}
  ports: [{name: http, port: 8000, targetPort: http}]
