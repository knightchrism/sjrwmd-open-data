apiVersion: apps/v1
kind: Deployment
metadata:
  name: martin
spec:
  replicas: 1
  selector: {matchLabels: {app: martin}}
  template:
    metadata: {labels: {app: martin}}
    spec:
      containers:
        - name: martin
          image: ghcr.io/maplibre/martin:latest
          ports: [{name: http, containerPort: 3000}]
          env:
            - name: DATABASE_URL       # martin reads DATABASE_URL and auto-publishes tables/views
              valueFrom: {secretKeyRef: {name: sjrwmd-db, key: READER_URL}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: martin
spec:
  selector: {app: martin}
  ports: [{name: http, port: 3000, targetPort: http}]
