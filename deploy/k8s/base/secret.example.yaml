# NOT applied by kustomize (no committed credentials). Create the Secret yourself before `kubectl apply -k`, e.g.:
#   READER_PW=$(openssl rand -hex 24)
#   kubectl -n sjrwmd create secret generic sjrwmd-db \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=LOADER_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=READER_PASSWORD="$READER_PW" \
#     --from-literal=READER_URL="postgres://sjrwmd_reader:${READER_PW}@postgis:5432/sjrwmd"
# or use Sealed Secrets / External Secrets / your cloud secret manager. Never commit real values.
# LOADER_PASSWORD and READER_PASSWORD are applied by initdb/02_role_passwords.sh on first start only;
# if you rotate them later, also run ALTER ROLE ... PASSWORD. This file documents the required keys:
apiVersion: v1
kind: Secret
metadata:
  name: sjrwmd-db
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""   # required
  LOADER_PASSWORD: ""     # required
  READER_PASSWORD: ""     # required
  READER_URL: ""          # required: postgres://sjrwmd_reader:<READER_PASSWORD>@postgis:5432/sjrwmd
