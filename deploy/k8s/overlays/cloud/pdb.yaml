# Keep at least one replica of each stateless service up during node drains/upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: featureserv}
spec: {minAvailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow, selector: {matchLabels: {app: featureserv}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: martin}
spec: {minAvailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow, selector: {matchLabels: {app: martin}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mcp}
spec: {minAvailable: 1, unhealthyPodEvictionPolicy: AlwaysAllow, selector: {matchLabels: {app: mcp}}}
