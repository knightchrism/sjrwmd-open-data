# DISABLED: manual trigger only, and the job is gated off until hosting is chosen.
# To enable: set repository variable HARVEST_ENABLED=true, add a PG connection secret, and uncomment `schedule`.
name: weekly-update
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 7 * * 1"   # Mondays 07:17 UTC
permissions: {contents: read}
jobs:
  harvest:
    if: ${{ vars.HARVEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: {contents: read}
    services:
      db:
        image: postgis/postgis:17-3.5
        env: {POSTGRES_DB: sjrwmd, POSTGRES_PASSWORD: ci_only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env: {PGHOST: localhost, PGPORT: "5432", PGDATABASE: sjrwmd, PGUSER: postgres, PGPASSWORD: ci_only}
    steps:
      - name: Harden runner (audit egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: {egress-policy: audit}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client gdal-bin
      - run: psql -v ON_ERROR_STOP=1 -f sql/01_init.sql
      - run: pip install -r requirements.txt
      - run: python harvest.py
      - run: psql -f qc/qc.sql
      - run: bash scripts/export.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: sjrwmd-export, path: dist/, retention-days: 7}
