# All passwords are required (no defaults): copy .env.example to .env and set them first.
# Ports bind to 127.0.0.1 by default; set BIND_ADDR=0.0.0.0 in .env only if you really need LAN access.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: sjrwmd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LOADER_PASSWORD: ${LOADER_PASSWORD:?set LOADER_PASSWORD in .env}
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD in .env}
    ports: ["${BIND_ADDR:-127.0.0.1}:${PG_HOST_PORT:-5432}:5432"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sjrwmd"]
      interval: 5s
      retries: 20
  featureserv:
    <<: *hardening
    image: pramsey/pg_featureserv:20250917@sha256:2f1cf3adbf159b440098b7b4d5c75d9679baae5c79aed7560a84a15aecddf886
    environment:
      DATABASE_URL: postgres://sjrwmd_reader:${READER_PASSWORD:?set READER_PASSWORD in .env}@db:5432/sjrwmd
    ports: ["${BIND_ADDR:-127.0.0.1}:9000:9000"]
    mem_limit: 256m
    depends_on: {db: {condition: service_healthy}}
  martin:
    <<: *hardening
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    environment:
      DATABASE_URL: postgres://sjrwmd_reader:${READER_PASSWORD:?set READER_PASSWORD in .env}@db:5432/sjrwmd
    ports: ["${BIND_ADDR:-127.0.0.1}:3000:3000"]
    mem_limit: 512m
    depends_on: {db: {condition: service_healthy}}
volumes:
  pgdata:
